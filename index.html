<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Undercover Royale</title>
  <meta name="description" content="Clash Royale themed party game: find the impostor in your clan, or guess the hidden card from its stats.">

  <!-- Installable app -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0a1733">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Undercover">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">

  <link rel="preload" href="./assets/fonts/Clash_Regular.otf" as="font" type="font/otf" crossorigin>
  <!-- three.js for Royale Rush, loaded only when that mode opens -->
  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }</script>
  <link rel="modulepreload" href="./vendor/preact-htm.js">
  <link rel="modulepreload" href="./vendor/icons.js">
  <link rel="stylesheet" href="./app.css">

  <script>
    // Keep the install prompt if it fires before app.js has loaded.
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installPrompt = e; });
  </script>
</head>
<body>
  <div id="root" class="h-full w-full"></div>
  <noscript><p style="padding:24px;text-align:center">Undercover Royale needs JavaScript to run.</p></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
