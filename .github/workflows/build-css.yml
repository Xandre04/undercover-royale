name: Build CSS

# Rebuilds app.css whenever the app or its styles change, so edits made on
# GitHub (no local tools) still ship with the right styles.
on:
  push:
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'src/tailwind.css'
      - 'tailwind.config.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-css-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build app.css
        run: npx --yes tailwindcss@3.4.17 -i src/tailwind.css -o app.css --minify
      - name: Commit app.css if it changed
        run: |
          git add app.css
          if git diff --cached --quiet; then
            echo "app.css is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild app.css"
          git push
